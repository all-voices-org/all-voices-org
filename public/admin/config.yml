backend:
  name: github
  repo: all-voices-org/all-voices-org
  branch: main

# local_backend: true

media_folder: 'public/assets/uploads'
public_folder: '/assets/uploads'
publish_mode: editorial_workflow

i18n:
  structure: multiple_folders
  locales: [en, es, fr, ar, sw, ht]
  default_locale: en

collections:
  - name: 'pages'
    label: 'Pages'
    folder: 'src/content/docs'
    create: false
    i18n: true
    sortable_fields: []
    fields:
      - { name: 'title', widget: 'string', i18n: true, duplicate: true }
      - { name: 'body', widget: 'markdown', i18n: true, duplicate: true }

  - name: 'resources'
    label: 'Resources'
    folder: 'src/content/resources'
    create: true
    i18n: true
    sortable_fields: ['title', 'type', 'level']
    summary: '[{{level}}] {{type}}: {{title}} ({{content.0.type}})'
    fields:
      - name: title
        label: 'Resource Title'
        widget: 'string'
        i18n: true
        duplicate: true

      - name: type
        label: 'Resource Type'
        widget: 'select'
        i18n: true
        duplicate: true
        options:
          - {
              label: 'Vocabulary Builder Worksheet',
              value: 'vocabulary-builder-worksheet'
            }
          - {
              label: 'Reading and Comprehension Check',
              value: 'reading-comprehension-check'
            }
          - { label: 'Writing Prompts', value: 'writing-prompts' }
          - { label: 'Conversation Templates', value: 'conversation-templates' }
          - { label: 'Video', value: 'video' }
          - { label: 'Conversation Cards', value: 'conversation-cards' }

      - name: summary
        label: 'Resource Summary'
        widget: 'text'
        i18n: true
        duplicate: true

      - name: level
        label: 'Proficiency Level'
        widget: 'select'
        i18n: true
        duplicate: true
        options:
          - { label: 'Beginner', value: 'beginner' }
          - { label: 'Intermediate', value: 'intermediate' }
          - { label: 'Advanced', value: 'advanced' }

      - name: topics
        label: 'Topics'
        widget: select
        i18n: true
        duplicate: true
        multiple: true
        options:
          - { label: 'Johnson County Culture', value: 'johnson-county-culture' }
          - {
              label: 'Bussing & Transportation',
              value: 'bussing-transportation'
            }
          - { label: 'Shopping', value: 'shopping' }
          - { label: 'Health Care', value: 'health-care' }
          - {
              label: 'Parent Responsibilities',
              value: 'parent-responsibilities'
            }
          - { label: 'Adult Responsibilities', value: 'adult-responsibilities' }
          - { label: 'Work Situations', value: 'work-situations' }
          - { label: 'Ordering food', value: 'ordering-food' }
          - { label: 'Talking on the Phone', value: 'talking-on-the-phone' }
          - { label: 'Interviewing', value: 'interviewing' }
          - {
              label: 'Meeting New People/Social Skills',
              value: 'meeting-new-people-social-skills'
            }

      - name: content
        label: 'Resource Content'
        hint: 'Add the content for the resource. Only one item is allowed.'
        widget: list
        i18n: true
        duplicate: true
        min: 1
        max: 1
        required: true
        collapsed: false
        types:
          - name: document
            label: 'Document'
            summary: "{{title}} - {{body | truncate(50, '...')}}"
            widget: object
            i18n: true
            duplicate: true
            fields:
              - {
                  name: 'body',
                  label: 'Body',
                  widget: 'markdown',
                  i18n: true,
                  duplicate: true
                }

          - name: pdf
            label: 'PDF File'
            summary: '{{file}}'
            widget: object
            i18n: true
            duplicate: true
            fields:
              - {
                  name: 'description',
                  label: 'Description',
                  widget: 'text',
                  i18n: true,
                  duplicate: true,
                  required: false
                }
              - {
                  name: 'file',
                  label: 'File Upload',
                  widget: 'file',
                  i18n: true,
                  duplicate: true
                }

          - name: 'video'
            label: 'Video File'
            summary: '{{file}}'
            widget: object
            i18n: true
            duplicate: true
            fields:
              - {
                  name: 'description',
                  label: 'Description',
                  widget: 'text',
                  i18n: true,
                  duplicate: true,
                  required: false
                }
              - {
                  name: 'file',
                  label: 'File Upload',
                  widget: 'file',
                  i18n: true,
                  duplicate: true
                }

          - name: 'link'
            label: 'External Link'
            summary: '{{url}}'
            widget: object
            i18n: true
            duplicate: true
            fields:
              - {
                  name: 'url',
                  label: 'URL',
                  widget: 'string',
                  i18n: true,
                  duplicate: true
                }

  - name: 'esl-resources'
    label: 'ESL Resources'
    folder: 'src/content/esl-resources'
    create: true
    summary: '{{content.0.type}}: {{title}}'
    fields:
      - name: title
        label: 'ESL Resource Title'
        widget: 'string'
        duplicate: true

      - name: summary
        label: 'ESL Resource Summary'
        widget: 'text'
        duplicate: true

      - name: topics
        label: 'ESL Topics'
        widget: select
        duplicate: true
        multiple: true
        options:
          - { label: 'New Tutor Essentials', value: 'new-tutor-essentials' }
          - {
              label: 'Lesson Planning & Resources',
              value: 'lesson-planning-resources'
            }
          - {
              label: 'Advanced Teaching Methods',
              value: 'advanced-teaching-methods'
            }

      - name: content
        label: 'ESL Resource Content'
        hint: 'Add the content for the resource. Only one item is allowed.'
        widget: list
        duplicate: true
        min: 1
        max: 1
        required: true
        collapsed: false
        types:
          - name: document
            label: 'Document'
            summary: "{{title}} - {{body | truncate(50, '...')}}"
            widget: object
            duplicate: true
            fields:
              - {
                  name: 'body',
                  label: 'Body',
                  widget: 'markdown',
                  duplicate: true
                }

          - name: pdf
            label: 'PDF File'
            summary: '{{file}}'
            widget: object
            duplicate: true
            fields:
              - {
                  name: 'description',
                  label: 'Description',
                  widget: 'text',
                  duplicate: true,
                  required: false
                }
              - {
                  name: 'file',
                  label: 'File Upload',
                  widget: 'file',
                  duplicate: true
                }

          - name: 'video'
            label: 'Video File'
            summary: '{{file}}'
            widget: object
            duplicate: true
            fields:
              - {
                  name: 'description',
                  label: 'Description',
                  widget: 'text',
                  duplicate: true,
                  required: false
                }
              - {
                  name: 'file',
                  label: 'File Upload',
                  widget: 'file',
                  duplicate: true
                }

          - name: 'link'
            label: 'External Link'
            summary: '{{url}}'
            widget: object
            duplicate: true
            fields:
              - { name: 'url', label: 'URL', widget: 'string', duplicate: true }
